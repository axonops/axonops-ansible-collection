---
# ============================================================================
# Kafka Role - Internal Variables (not for overriding)
# ============================================================================

kafka__download_url: "{{ kafka_download_url_override if kafka_download_url_override | length > 0 else 'https://dlcdn.apache.org/kafka/' ~ kafka_version ~ '/kafka_' ~ kafka_scala_version ~ '-' ~ kafka_version ~ '.tgz' }}"
kafka__download_destination: "{{ kafka_install_root }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
kafka__install_path: "{{ kafka_install_root }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
kafka__home: "{{ kafka_install_root }}/kafka"
kafka__config_path: "{{ kafka__home }}/config/server.properties"
kafka__uuid_file: "{{ kafka__home }}/CLUSTER_UUID.lock"
kafka__opts: "{{ (kafka_opts | type_debug == 'list') | ternary(kafka_opts | join(' '), kafka_opts) }}"

kafka__java_pkg: >-
  {{ (ansible_os_family == 'Debian') | ternary(
    'openjdk-' ~ kafka_java_version ~ '-jre-headless',
    'java-' ~ kafka_java_version ~ '-openjdk-headless') }}

kafka__has_broker: "{{ 'broker' in kafka_node_roles }}"
kafka__has_controller: "{{ 'controller' in kafka_node_roles }}"

# Effective broker / controller listener protocol, derived from security flags.
#   tls + sasl → SASL_SSL
#   sasl only  → SASL_PLAINTEXT
#   tls only   → SSL
#   neither    → PLAINTEXT
kafka__sec_on: "{{ kafka_security_enabled | bool }}"
kafka__tls_on: "{{ kafka__sec_on and (kafka_tls_enabled | bool) }}"
kafka__sasl_on: "{{ kafka__sec_on and (kafka_sasl_enabled | bool) }}"

kafka__broker_protocol: >-
  {{ 'SASL_SSL' if (kafka__tls_on and kafka__sasl_on)
     else ('SASL_PLAINTEXT' if kafka__sasl_on
     else ('SSL' if kafka__tls_on else 'PLAINTEXT')) }}
kafka__controller_protocol: "{{ kafka__broker_protocol }}"

# Lowercase mechanism for listener.name.<>.<mech>.sasl.jaas.config keys.
kafka__sasl_mech_lower: "{{ kafka_sasl_mechanism | lower }}"
kafka__sasl_login_module: >-
  {{ 'org.apache.kafka.common.security.scram.ScramLoginModule'
     if kafka_sasl_mechanism.startswith('SCRAM')
     else 'org.apache.kafka.common.security.plain.PlainLoginModule' }}

# Listener name = protocol family. Keeps listener.security.protocol.map simple.
kafka__broker_listener_name: "{{ kafka__broker_protocol }}"
kafka__controller_listener_name: CONTROLLER

# Broker listeners, normalised by tasks/listeners.yml. The fact is always set
# there — empty on controller-only nodes.

# The listener the role's own clients bootstrap against: kafka-topics.sh,
# kafka-acls.sh, kafka-configs.sh and the AxonOps agent all connect to
# localhost:9092, so admin.properties and the agent client config must describe
# whichever listener is bound there. Falls back to the first broker listener,
# then to the controller settings on controller-only nodes.
kafka__bootstrap_listener: >-
  {{ ((kafka__broker_listeners | default([]) | selectattr('port', 'equalto', 9092) | list)
      + (kafka__broker_listeners | default([]))
      + [{'protocol': kafka__controller_protocol, 'tls': kafka__tls_on, 'sasl': kafka__sasl_on}]) | first }}

# TLS material must be on disk when the controller listeners terminate TLS *or*
# when any broker listener does — a single TLS listener is enough to need a
# keystore, even with kafka_tls_enabled: false.
kafka__tls_needed: >-
  {{ kafka__sec_on and ((kafka_tls_enabled | bool)
     or (kafka__broker_listeners | default([]) | selectattr('tls') | list | length > 0)) }}

# True when ANY host in the play needs a generated CA. run_once tasks execute on
# the first host in the play and evaluate their conditions — and read their
# variables — against that host, which may be a controller-only node with no TLS
# listeners and a different kafka_tls_mode. The shared CA in tls_ca.yml is
# therefore guarded by this alone: it carries no per-host term.
#
# For the same reason the kafka_tls_generate_* settings are read from the first
# host in the play. Set them play-wide (they describe one cluster-wide CA), not
# on a broker-only group, or the CA is built from the role defaults instead.
kafka__tls_generate_anywhere: >-
  {{ ansible_play_hosts
     | map('extract', hostvars, 'kafka__tls_generate_fact')
     | map('default', false) | map('bool') | select | list | length > 0 }}

# TLS material paths used by template + tasks.
# Kafka 4.x PEM keystore loads a single file containing the cert chain followed
# by the private key. The role assembles this combined file in kafka_tls_remote_dir
# regardless of source mode.
kafka__tls_keystore_file: "{{ kafka_tls_remote_dir }}/keystore.pem"
kafka__tls_truststore_file: "{{ kafka_tls_remote_dir }}/ca.pem"

# Source paths for the keystore assembly step.
# custom    — copied from control node
# pki_agent — already on disk at user-supplied paths, read directly
# generate  — produced locally then copied
kafka__tls_src_cert: "{{ kafka_tls_pki_cert_path if kafka_tls_mode == 'pki_agent' else (kafka_tls_remote_dir ~ '/source.crt') }}"
kafka__tls_src_key: "{{ kafka_tls_pki_key_path if kafka_tls_mode == 'pki_agent' else (kafka_tls_remote_dir ~ '/source.key') }}"
kafka__tls_src_ca: "{{ kafka_tls_pki_ca_path if kafka_tls_mode == 'pki_agent' else (kafka_tls_remote_dir ~ '/source.ca.crt') }}"

# Normalised key (PKCS#8) used to build the keystore. Kafka's PEM keystore
# loader rejects PKCS#1 RSA keys, so source keys are converted in place.
kafka__tls_normalised_key: "{{ kafka_tls_remote_dir }}/normalised.key"

# SANs for the generated per-host certificate (generate mode). Every name a
# client — or a certificate scanner — may connect to has to appear here, so the
# advertised host of each extra listener is folded in. Entries that are all
# digits and dots are treated as IPv4 and emitted as IP: SANs, everything else
# as DNS:. IPv6 literals must be supplied via kafka_tls_generate_extra_sans.
kafka__tls_san_candidates: >-
  {{ ([inventory_hostname, 'localhost', '127.0.0.1']
      + ([kafka_node_ip] if kafka_node_ip is defined else [])
      + (kafka__broker_listeners | default([])
         | map(attribute='advertised_host') | select('string') | reject('equalto', '') | list))
     | unique | list }}
kafka__tls_generate_sans: >-
  {{ ((kafka__tls_san_candidates | reject('match', '^[0-9.]+$') | map('regex_replace', '^', 'DNS:') | list)
      + (kafka__tls_san_candidates | select('match', '^[0-9.]+$') | map('regex_replace', '^', 'IP:') | list)
      + kafka_tls_generate_extra_sans) | unique | list }}

# Reload helper script used as pki_agent reload_command. Reassembles keystore on
# cert rotation then restarts kafka.
kafka__tls_reload_script: /usr/local/sbin/kafka-reload-tls.sh

# Admin client properties consumed by kafka-topics.sh / kafka-acls.sh via
# --command-config when security is enabled.
kafka__admin_props_file: "{{ kafka__home }}/config/admin.properties"
