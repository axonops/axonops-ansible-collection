---
# ============================================================================
# Kafka Role - Internal Variables (not for overriding)
# ============================================================================

_kafka_download_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
_kafka_download_destination: "{{ kafka_install_root }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
_kafka_install_path: "{{ kafka_install_root }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
_kafka_home: "{{ kafka_install_root }}/kafka"
_kafka_config_path: "{{ _kafka_home }}/config/server.properties"
_kafka_uuid_file: "{{ _kafka_home }}/CLUSTER_UUID.lock"
_kafka_opts: "{{ (kafka_opts | type_debug == 'list') | ternary(kafka_opts | join(' '), kafka_opts) }}"

_kafka_java_pkg: >-
  {{ (ansible_os_family == 'Debian') | ternary(
    'openjdk-' ~ kafka_java_version ~ '-jre-headless',
    'java-' ~ kafka_java_version ~ '-openjdk-headless') }}

_kafka_has_broker: "{{ 'broker' in kafka_node_roles }}"
_kafka_has_controller: "{{ 'controller' in kafka_node_roles }}"

# Effective broker / controller listener protocol, derived from security flags.
#   tls + sasl → SASL_SSL
#   sasl only  → SASL_PLAINTEXT
#   tls only   → SSL
#   neither    → PLAINTEXT
_kafka_sec_on: "{{ kafka_security_enabled | bool }}"
_kafka_tls_on: "{{ _kafka_sec_on and (kafka_tls_enabled | bool) }}"
_kafka_sasl_on: "{{ _kafka_sec_on and (kafka_sasl_enabled | bool) }}"

_kafka_broker_protocol: >-
  {{ 'SASL_SSL' if (_kafka_tls_on and _kafka_sasl_on)
     else ('SASL_PLAINTEXT' if _kafka_sasl_on
     else ('SSL' if _kafka_tls_on else 'PLAINTEXT')) }}
_kafka_controller_protocol: "{{ _kafka_broker_protocol }}"

# Lowercase mechanism for listener.name.<>.<mech>.sasl.jaas.config keys.
_kafka_sasl_mech_lower: "{{ kafka_sasl_mechanism | lower }}"
_kafka_sasl_login_module: >-
  {{ 'org.apache.kafka.common.security.scram.ScramLoginModule'
     if kafka_sasl_mechanism.startswith('SCRAM')
     else 'org.apache.kafka.common.security.plain.PlainLoginModule' }}

# The CONTROLLER listener always uses PLAIN, whatever kafka_sasl_mechanism is.
# KRaft controllers cannot authenticate each other with SCRAM: SCRAM credentials
# live in the metadata log, which is only readable once the quorum has a leader,
# so Raft vote requests fail authentication and no leader is ever elected.
# PLAIN validates against the static JAAS entry for the inter-broker identity.
_kafka_sasl_controller_mechanism: PLAIN
_kafka_sasl_controller_login_module: org.apache.kafka.common.security.plain.PlainLoginModule

# Listener name = protocol family. Keeps listener.security.protocol.map simple.
_kafka_broker_listener_name: "{{ _kafka_broker_protocol }}"
_kafka_controller_listener_name: CONTROLLER

_kafka_default_listeners: >-
  {{
    ([_kafka_broker_listener_name ~ '://:9092'] if _kafka_has_broker | bool else []) +
    ([_kafka_controller_listener_name ~ '://:9093'] if _kafka_has_controller | bool else [])
  }}

_kafka_effective_listeners: "{{ (kafka_listeners | length > 0) | ternary(kafka_listeners, _kafka_default_listeners) }}"

# TLS material paths used by template + tasks.
# Kafka 4.x PEM keystore loads a single file containing the cert chain followed
# by the private key. The role assembles this combined file in kafka_tls_remote_dir
# regardless of source mode.
_kafka_tls_keystore_file: "{{ kafka_tls_remote_dir }}/keystore.pem"
_kafka_tls_truststore_file: "{{ kafka_tls_remote_dir }}/ca.pem"

# Source paths for the keystore assembly step.
# custom    — copied from control node
# pki_agent — already on disk at user-supplied paths, read directly
# generate  — produced locally then copied
_kafka_tls_src_cert: "{{ kafka_tls_pki_cert_path if kafka_tls_mode == 'pki_agent' else (kafka_tls_remote_dir ~ '/source.crt') }}"
_kafka_tls_src_key: "{{ kafka_tls_pki_key_path if kafka_tls_mode == 'pki_agent' else (kafka_tls_remote_dir ~ '/source.key') }}"
_kafka_tls_src_ca: "{{ kafka_tls_pki_ca_path if kafka_tls_mode == 'pki_agent' else (kafka_tls_remote_dir ~ '/source.ca.crt') }}"

# Normalised key (PKCS#8) used to build the keystore. Kafka's PEM keystore
# loader rejects PKCS#1 RSA keys, so source keys are converted in place.
_kafka_tls_normalised_key: "{{ kafka_tls_remote_dir }}/normalised.key"

# Reload helper script used as pki_agent reload_command. Reassembles keystore on
# cert rotation then restarts kafka.
_kafka_tls_reload_script: /usr/local/sbin/kafka-reload-tls.sh

# Admin client properties consumed by kafka-topics.sh / kafka-acls.sh via
# --command-config when security is enabled.
_kafka_admin_props_file: "{{ _kafka_home }}/config/admin.properties"
# Same, for tools run with --bootstrap-controller (CONTROLLER listener security).
_kafka_controller_admin_props_file: "{{ _kafka_home }}/config/controller-admin.properties"
