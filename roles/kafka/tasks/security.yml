---
# ============================================================================
# Kafka Role - Security orchestrator
# ============================================================================
# Runs only when kafka_security_enabled is true. Each sub-feature is opt-in.

# kafka__tls_needed is true when kafka_tls_enabled is set OR when any entry in
# kafka_listeners sets tls: true — one TLS listener needs the same on-disk PEM
# material even if the other listeners stay plaintext.
- name: Assert TLS mode is valid
  ansible.builtin.assert:
    that:
      - kafka_tls_mode in ['custom', 'pki_agent', 'generate']
    fail_msg: "kafka_tls_mode must be one of: custom, pki_agent, generate"
  when: kafka__tls_needed | bool
  tags: tls

- name: Assert custom-mode TLS paths are provided
  ansible.builtin.assert:
    that:
      - kafka_tls_cert | length > 0
      - kafka_tls_key | length > 0
      - kafka_tls_ca | length > 0
    fail_msg: >-
      kafka_tls_mode is 'custom' but kafka_tls_cert / kafka_tls_key /
      kafka_tls_ca are not all set.
  when:
    - kafka__tls_needed | bool
    - kafka_tls_mode == 'custom'
  tags: tls

# Single play-wide guard with no per-host term. These tasks are run_once, so
# any host-specific condition here would be evaluated against the first host in
# the play and could skip the CA for everyone. kafka_tls_mode is folded into
# kafka__tls_generate_fact in listeners.yml for exactly that reason.
- name: Create local CA (generate mode)
  ansible.builtin.import_tasks: tls_ca.yml
  when: kafka__tls_generate_anywhere | bool
  tags: tls

- name: Configure TLS
  ansible.builtin.import_tasks: tls.yml
  when: kafka__tls_needed | bool
  tags: tls

- name: Configure SASL pre-flight
  ansible.builtin.import_tasks: sasl.yml
  when: kafka_sasl_enabled | bool
  tags: sasl

- name: Render admin client properties
  ansible.builtin.template:
    src: admin.properties.j2
    dest: "{{ kafka__admin_props_file }}"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0600"
  tags: tls,sasl
