---
# Realises features/secured-cluster.feature. Each play maps to one Scenario.
- name: "Scenario: The controller quorum elects a leader"
  hosts: all
  gather_facts: false
  vars:
    kafka_bin: /opt/kafka/bin
    kafka_cfg: /opt/kafka/config
    is_controller: "{{ not inventory_hostname.endswith('-4') }}"
  tags: [quorum]
  tasks:
    # Then every node listens on the broker port
    - name: Broker port 9092 is listening
      ansible.builtin.wait_for:
        port: 9092
        timeout: 30

    # And every controller node listens on the controller port
    - name: Controller port 9093 is listening
      ansible.builtin.wait_for:
        port: 9093
        timeout: 30
      when: is_controller | bool

    # And the quorum reports a leader through the broker listener
    - name: Describe quorum through the broker listener
      ansible.builtin.command:
        argv:
          - "{{ kafka_bin }}/kafka-metadata-quorum.sh"
          - --bootstrap-server
          - localhost:9092
          - --command-config
          - "{{ kafka_cfg }}/admin.properties"
          - describe
          - --status
      register: quorum_broker
      changed_when: false

    - name: Assert a leader is elected (broker listener)
      ansible.builtin.assert:
        that:
          - quorum_broker.stdout is search('LeaderId:\\s+[1-3]\\b')
        fail_msg: "No quorum leader reported: {{ quorum_broker.stdout }}"

    # And the quorum reports a leader through the controller listener
    - name: Describe quorum through the controller listener
      ansible.builtin.command:
        argv:
          - "{{ kafka_bin }}/kafka-metadata-quorum.sh"
          - --bootstrap-controller
          - localhost:9093
          - --command-config
          - "{{ kafka_cfg }}/controller-admin.properties"
          - describe
          - --status
      register: quorum_controller
      changed_when: false
      when: is_controller | bool

    - name: Assert a leader is elected (controller listener)
      ansible.builtin.assert:
        that:
          - quorum_controller.stdout is search('LeaderId:\\s+[1-3]\\b')
        fail_msg: "No quorum leader reported: {{ quorum_controller.stdout }}"
      when: is_controller | bool

- name: "Scenario: An authorised SCRAM client round-trips a message (produce)"
  hosts: "*-4"
  gather_facts: false
  vars:
    kafka_bin: /opt/kafka/bin
    app1_props: /tmp/molecule-app1.properties
  tags: [roundtrip]
  tasks:
    - name: Write app1 SASL_SSL client properties
      ansible.builtin.copy:
        dest: "{{ app1_props }}"
        mode: "0600"
        content: &app1_props |
          security.protocol=SASL_SSL
          ssl.truststore.type=PEM
          ssl.truststore.location=/etc/kafka/tls/ca.pem
          ssl.endpoint.identification.algorithm=
          sasl.mechanism=SCRAM-SHA-512
          sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="app1" password="molecule-app1-secret";

    - name: Pin a unique message for this run
      ansible.builtin.set_fact:
        roundtrip_message: "molecule-roundtrip-{{ lookup('pipe', 'date +%s%N') }}"

    # When the client "app1" produces a message from the broker-only node
    - name: Produce one message as app1
      ansible.builtin.command:
        argv:
          - "{{ kafka_bin }}/kafka-console-producer.sh"
          - --bootstrap-server
          - localhost:9092
          - --producer.config
          - "{{ app1_props }}"
          - --topic
          - events
        stdin: "{{ roundtrip_message }}"
      changed_when: false

- name: "Scenario: An authorised SCRAM client round-trips a message (consume)"
  hosts: "*-1"
  gather_facts: false
  vars:
    kafka_bin: /opt/kafka/bin
    app1_props: /tmp/molecule-app1.properties
    roundtrip_message: "{{ hostvars[groups['all'] | select('match', '.*-4$') | first]['roundtrip_message'] }}"
  tags: [roundtrip]
  tasks:
    - name: Write app1 SASL_SSL client properties
      ansible.builtin.copy:
        dest: "{{ app1_props }}"
        mode: "0600"
        content: *app1_props

    # Then the client "app1" consumes the same message from a combined node
    - name: Consume messages as app1
      ansible.builtin.command:
        argv:
          - "{{ kafka_bin }}/kafka-console-consumer.sh"
          - --bootstrap-server
          - localhost:9092
          - --consumer.config
          - "{{ app1_props }}"
          - --topic
          - events
          - --group
          - molecule-verify
          - --from-beginning
          - --timeout-ms
          - "30000"
      register: consumed
      # The consumer exits non-zero on timeout after draining the topic.
      failed_when: roundtrip_message not in consumed.stdout
      changed_when: false

- name: "Scenario: A client without SASL credentials is refused"
  hosts: "*-1"
  gather_facts: false
  vars:
    kafka_bin: /opt/kafka/bin
    nosasl_props: /tmp/molecule-nosasl.properties
  tags: [refused]
  tasks:
    # When a client connects over TLS without SASL credentials
    - name: Write TLS-only client properties
      ansible.builtin.copy:
        dest: "{{ nosasl_props }}"
        mode: "0600"
        content: |
          security.protocol=SSL
          ssl.truststore.type=PEM
          ssl.truststore.location=/etc/kafka/tls/ca.pem
          ssl.endpoint.identification.algorithm=
          request.timeout.ms=5000
          default.api.timeout.ms=10000

    - name: List topics without SASL credentials
      ansible.builtin.command:
        argv:
          - "{{ kafka_bin }}/kafka-topics.sh"
          - --bootstrap-server
          - localhost:9092
          - --command-config
          - "{{ nosasl_props }}"
          - --list
      register: nosasl
      failed_when: false
      changed_when: false

    # Then the request fails
    - name: Assert the request failed
      ansible.builtin.assert:
        that:
          - nosasl.rc != 0
          - "'events' not in nosasl.stdout_lines"
        fail_msg: "A client without SASL credentials was served: {{ nosasl.stdout }}"

- name: "Scenario: A client with a wrong SCRAM password is refused"
  hosts: "*-1"
  gather_facts: false
  vars:
    kafka_bin: /opt/kafka/bin
    badpw_props: /tmp/molecule-badpw.properties
  tags: [refused]
  tasks:
    # When the client "app1" connects with a wrong password
    - name: Write app1 client properties with a wrong password
      ansible.builtin.copy:
        dest: "{{ badpw_props }}"
        mode: "0600"
        content: |
          security.protocol=SASL_SSL
          ssl.truststore.type=PEM
          ssl.truststore.location=/etc/kafka/tls/ca.pem
          ssl.endpoint.identification.algorithm=
          sasl.mechanism=SCRAM-SHA-512
          sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="app1" password="wrong-password";
          request.timeout.ms=5000
          default.api.timeout.ms=10000

    - name: List topics with a wrong password
      ansible.builtin.command:
        argv:
          - "{{ kafka_bin }}/kafka-topics.sh"
          - --bootstrap-server
          - localhost:9092
          - --command-config
          - "{{ badpw_props }}"
          - --list
      register: badpw
      failed_when: false
      changed_when: false

    # Then the request fails with an authentication error
    - name: Assert an authentication error
      ansible.builtin.assert:
        that:
          - badpw.rc != 0
          - (badpw.stdout ~ badpw.stderr) is search('SaslAuthenticationException|Authentication failed')
        fail_msg: "Wrong password not rejected: rc={{ badpw.rc }} {{ badpw.stderr }}"

# code: language=ansible
