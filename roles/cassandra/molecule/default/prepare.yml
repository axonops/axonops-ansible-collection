---
# Reproduce a bare host without setuptools (issue #155: cqlsh venv fails on
# Rocky Linux 10). The geerlingguy test images pre-install setuptools because they
# install Ansible with pip, which masks the bug. Strip it so converge proves
# the role installs python3-setuptools itself.
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    # Ansible in the test images runs from a pip install, so removing the OS
    # package (and dependents such as python3-pip) is safe and leaves package
    # manager state consistent. The role must reinstall them.
    - name: Remove the python3-setuptools OS package and its dependents (RedHat)
      when: ansible_os_family == "RedHat"
      ansible.builtin.dnf:
        name: python3-setuptools
        state: absent

    - name: Remove the python3-setuptools OS package and its dependents (Debian)
      when: ansible_os_family == "Debian"
      ansible.builtin.apt:
        name: python3-setuptools
        state: absent

    # --break-system-packages needs pip >= 23.0.1; on older pip this fails
    # silently, but the pkg_resources assertion below still catches leftovers.
    - name: Remove any pip-installed setuptools from the system Python
      ansible.builtin.command: >-
        {{ ansible_python.executable }} -m pip uninstall -y --break-system-packages setuptools
      register: prepare_pip_remove
      changed_when: "'Successfully uninstalled' in prepare_pip_remove.stdout"
      failed_when: false

    - name: Check whether pkg_resources is still importable
      ansible.builtin.command: "{{ ansible_python.executable }} -c 'import pkg_resources'"
      register: prepare_pkg_resources
      changed_when: false
      failed_when: false

    - name: Assert the host no longer has setuptools
      ansible.builtin.assert:
        that:
          - prepare_pkg_resources.rc != 0
        fail_msg: setuptools still importable; prepare could not reproduce a bare host
