---
# BDD verification — G1 JVM options
#
# Behaviour under test: with the default collector the rendered JVM options
# MUST select G1 and MUST NOT enable Transparent Huge Pages, which this role
# disables at the operating-system level instead.

- name: Verify G1 JVM options (BDD)
  hosts: all
  gather_facts: false
  vars:
    jvm_options_files:
      - jvm11-server.options
      - jvm17-server.options
  tasks:

    - name: GIVEN — the tar install laid down a Cassandra configuration directory
      ansible.builtin.find:
        paths: /opt
        patterns: "apache-cassandra-*"
        file_type: directory
      register: verify_install_dir

    - name: THEN — exactly one Cassandra install directory was found
      ansible.builtin.assert:
        that:
          - verify_install_dir.files | length == 1
        fail_msg: >-
          expected exactly one apache-cassandra-* directory under /opt,
          found {{ verify_install_dir.files | length }}

    - name: GIVEN — the configuration directory is known
      ansible.builtin.set_fact:
        cassandra_conf_dir: "{{ verify_install_dir.files[0].path }}/conf"

    - name: GIVEN — the converged node rendered its JVM options with G1 enabled
      ansible.builtin.slurp:
        src: "{{ cassandra_conf_dir }}/{{ item }}"
      loop: "{{ jvm_options_files }}"
      register: verify_jvm_options

    - name: THEN — G1 is selected and Transparent Huge Pages are not enabled
      ansible.builtin.assert:
        that:
          - "'-XX:+UseG1GC' in ((item.content | b64decode).splitlines() | reject('match', '^\\s*#') | list)"
          - "'-XX:+UseTransparentHugePages' not in ((item.content | b64decode).splitlines() | reject('match', '^\\s*#') | list)"
        fail_msg: "{{ item.item }} does not render the expected G1 options"
      loop: "{{ verify_jvm_options.results }}"
      loop_control:
        label: "{{ item.item }}"

# code: language=ansible
