---
- name: Set the agent disconnection tolerance on {{ cluster }} in {{ org }}
  axonops.axonops.agent_disconnection_tolerance:
    org: "{{ org }}"
    cluster: "{{ cluster }}"
    cluster_type: "{{ agent_disconnection_tolerance.cluster_type | default(cluster_type | default(omit)) }}"
    warn_timeout: "{{ agent_disconnection_tolerance.value.warn_timeout | default('30s') }}"
    error_timeout: "{{ agent_disconnection_tolerance.value.error_timeout | default('1m') }}"
    base_url: "{{ base_url | default(omit) }}"
    auth_token: "{{ agent_disconnection_tolerance.auth_token | default(auth_token | default(omit)) }}"
    api_token: "{{ agent_disconnection_tolerance.api_token | default(api_token | default(omit)) }}"
    username: "{{ agent_disconnection_tolerance.username | default(username | default(omit)) }}"
    password: "{{ agent_disconnection_tolerance.password | default(password | default(omit)) }}"
    override_saas: "{{ override_saas | default(omit) }}"
    use_saml: "{{ use_saml | default(omit) }}"
    validate_certs: "{{ validate_certs | default(omit) }}"
  no_log: "{{ false if enable_logging is defined and enable_logging else true }}"
  tags:
  - axonops_agent_disconnection_tolerance
  - agent_disconnection_tolerance
  - disconnection_tolerance

# code: language=ansible
