---
- name: Initialize axonops_dashboard_templates
  tags: always
  ansible.builtin.set_fact:
    axonops_dashboard_templates: []
  when: axonops_dashboard_templates is not defined

- name: Load organization-wide alert rules
  tags: always
  ansible.builtin.set_fact:
    axonops_dashboard_templates: "{{ axonops_dashboard_templates + (lookup('file', item) | from_yaml).axonops_dashboard_templates }}"
  with_fileglob:
    - "config/{{ org }}/dashboards.yml"

- name: Load cluster-specific alert rules
  tags: always
  ansible.builtin.set_fact:
    axonops_dashboard_templates: "{{ axonops_dashboard_templates + (lookup('file', item) | from_yaml).axonops_dashboard_templates }}"
  with_fileglob:
    - "config/{{ org }}/{{ cluster }}/dashboards.yml"

- name: "Install dashboard templates on {{ org }}/{{ cluster }}"
  axonops.axonops.dashboard_template:
    org: "{{ org }}"
    cluster: "{{ cluster }}"
    cluster_type: "{{ dashboard_item.cluster_type | default(cluster_type | default(omit)) }}"
    name: "{{ dashboard_item.name }}"
    filters: "{{ dashboard_item.filters | default(omit) }}"
    panels: "{{ dashboard_item.panels | default(omit) }}"
    base_url: "{{ base_url | default(omit) }}"
    auth_token: "{{ dashboard_item.auth_token | default(auth_token | default(omit)) }}"
    api_token: "{{ dashboard_item.api_token | default(api_token | default(omit)) }}"
    username: "{{ dashboard_item.username | default(username | default(omit)) }}"
    password: "{{ dashboard_item.password | default(password | default(omit)) }}"
    override_saas: "{{ override_saas | default(omit) }}"
    use_saml: "{{ use_saml | default(omit) }}"
    validate_certs: "{{ validate_certs | default(omit) }}"
  with_items:
    "{{ axonops_dashboard_templates }}"
  no_log: "{{ false if enable_logging is defined and enable_logging else true }}"
  loop_control:
    loop_var: dashboard_item
  tags:
  - dashboards
  - dashboard

# code: language=ansible
