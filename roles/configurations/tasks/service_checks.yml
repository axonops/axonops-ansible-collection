---
- name: Initialize axonops_shell_check
  tags: always
  ansible.builtin.set_fact:
    axonops_shell_check: []
  when: axonops_shell_check is not defined

- name: Load organization-wide shell check rules
  tags: always
  ansible.builtin.set_fact:
    axonops_shell_check: "{{ axonops_shell_check + ((lookup('file', item) | from_yaml).axonops_shell_check | default([])) }}"
  with_fileglob:
    - "config/{{ org }}/service_checks.yml"

- name: Load cluster-specific shell check rules
  tags: always
  ansible.builtin.set_fact:
    axonops_shell_check: "{{ axonops_shell_check + ((lookup('file', item) | from_yaml).axonops_shell_check | default([])) }}"
  with_fileglob:
    - "config/{{ org }}/{{ cluster }}/service_checks.yml"

- name: Initialize axonops_tcp_check
  tags: always
  ansible.builtin.set_fact:
    axonops_tcp_check: []

- name: Load organization-wide tcp check rules
  tags: always
  ansible.builtin.set_fact:
    axonops_tcp_check: "{{ axonops_tcp_check + (lookup('file', item) | from_yaml).axonops_tcp_check | default([]) }}"
  with_fileglob:
    - "config/{{ org }}/service_checks.yml"

- name: Load cluster-specific tcp check rules
  tags: always
  ansible.builtin.set_fact:
    axonops_tcp_check: "{{ axonops_tcp_check + (lookup('file', item) | from_yaml).axonops_tcp_check | default([]) }}"
  with_fileglob:
    - "config/{{ org }}/{{ cluster }}/service_checks.yml"

- name: "Apply TCP Check on {{ org }}/{{ cluster }}"
  axonops.axonops.tcp_check:
    org: "{{ org }}"
    cluster: "{{ cluster }}"
    cluster_type: "{{ tcpcheck_item.cluster_type | default(cluster_type | default(omit)) }}"
    present: "{{ tcpcheck_item.present | default(true) }}"
    name: "{{ tcpcheck_item.name | default('') }}"
    interval: "{{ tcpcheck_item.interval }}"
    timeout: "{{ tcpcheck_item.timeout }}"
    tcp: "{{ tcpcheck_item.tcp }}"
    base_url: "{{ base_url | default(omit) }}"
    auth_token: "{{ tcpcheck_item.auth_token | default(auth_token | default(omit)) }}"
    api_token: "{{ tcpcheck_item.api_token | default(api_token | default(omit)) }}"
    username: "{{ tcpcheck_item.username | default(username | default(omit)) }}"
    password: "{{ tcpcheck_item.password | default(password | default(omit)) }}"
    override_saas: "{{ override_saas | default(omit) }}"
    use_saml: "{{ use_saml | default(omit) }}"
    validate_certs: "{{ validate_certs | default(omit) }}"
  with_items:
    "{{ axonops_tcp_check }}"
  no_log: "{{ false if enable_logging is defined and enable_logging else true }}"
  loop_control:
    loop_var: tcpcheck_item
  tags:
    - axonops_tcp_check
    - tcp_check
    - check
    - tcp

- name: "Apply Shell Check on {{ org }}/{{ cluster }}"
  axonops.axonops.shell_check:
    org: "{{ org }}"
    cluster: "{{ cluster }}"
    cluster_type: "{{ shellcheck_item.cluster_type | default(cluster_type | default(omit)) }}"
    present: "{{ shellcheck_item.present | default(true) }}"
    name: "{{ shellcheck_item.name | default('') }}"
    interval: "{{ shellcheck_item.interval }}"
    timeout: "{{ shellcheck_item.timeout }}"
    shell: "{{ shellcheck_item.shell | default('/bin/bash') }}"
    script: "{{ shellcheck_item.script }}"
    base_url: "{{ base_url | default(omit) }}"
    auth_token: "{{ shellcheck_item.auth_token | default(auth_token | default(omit)) }}"
    api_token: "{{ shellcheck_item.api_token | default(api_token | default(omit)) }}"
    username: "{{ shellcheck_item.username | default(username | default(omit)) }}"
    password: "{{ shellcheck_item.password | default(password | default(omit)) }}"
    override_saas: "{{ override_saas | default(omit) }}"
    use_saml: "{{ use_saml | default(omit) }}"
    validate_certs: "{{ validate_certs | default(omit) }}"
  with_items:
    "{{ axonops_shell_check }}"
  no_log: "{{ false if enable_logging is defined and enable_logging else true }}"
  loop_control:
    loop_var: shellcheck_item
  tags:
    - axonops_shell_check
    - shell_check
    - check
    - shell

# code: language=ansible
