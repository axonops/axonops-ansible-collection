---
- name: Initialize axonops_slack_integrations
  tags: always
  ansible.builtin.set_fact:
    axonops_slack_integrations: []
  when: axonops_slack_integrations is not defined

- name: Load organization-wide Slack integration rules
  tags: always
  ansible.builtin.set_fact:
    axonops_slack_integrations: "{{ axonops_slack_integrations + (lookup('file', item) | from_yaml).axonops_slack_integrations }}"
  with_fileglob:
    - "config/{{ org }}/slack_integrations.yml"

- name: Load cluster-specific Slack integration rules
  tags: always
  ansible.builtin.set_fact:
    axonops_slack_integrations: "{{ axonops_slack_integrations + (lookup('file', item) | from_yaml).axonops_slack_integrations }}"
  with_fileglob:
    - "config/{{ org }}/{{ cluster }}/slack_integrations.yml"

- name: "Install Slack integrations {{ org }}/{{ cluster }}"
  axonops.axonops.slack_integration:
    org: "{{ org }}"
    cluster: "{{ cluster }}"
    cluster_type: "{{ slack_item.cluster_type | default(cluster_type | default(omit)) }}"
    present: "{{ slack_item.present | default(true) }}"
    name: "{{ slack_item.name }}"
    webhook_url: "{{ slack_item.webhook_url }}"
    base_url: "{{ base_url | default(omit) }}"
    auth_token: "{{ slack_item.auth_token | default(auth_token | default(omit)) }}"
    api_token: "{{ slack_item.api_token | default(api_token | default(omit)) }}"
    username: "{{ slack_item.username | default(username | default(omit)) }}"
    password: "{{ slack_item.password | default(password | default(omit)) }}"
    override_saas: "{{ override_saas | default(omit) }}"
    use_saml: "{{ use_saml | default(omit) }}"
    validate_certs: "{{ validate_certs | default(omit) }}"
  loop: "{{ axonops_slack_integrations }}"
  no_log: "{{ false if enable_logging is defined and enable_logging else true }}"
  loop_control:
    loop_var: slack_item
  tags:
    - axonops_slack_integrations
    - slack_integrations
    - slack_integration
    - integration
    - slack

# code: language=ansible
