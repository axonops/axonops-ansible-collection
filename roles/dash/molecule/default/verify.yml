---
- name: Verify
  hosts: all
  vars:
    # Role defaults are not loaded here; must match the default in defaults/main.yml.
    axon_dash_reporting_url: "http://127.0.0.1:8081"
  tasks:
    - name: Read rendered axon-dash.yml
      ansible.builtin.slurp:
        src: /etc/axonops/axon-dash.yml
      register: axon_dash_config

    - name: Decode rendered config
      ansible.builtin.set_fact:
        axon_dash_config_text: "{{ axon_dash_config.content | b64decode }}"

    - name: Assert reporting_url is templated from axon_dash_reporting_url
      ansible.builtin.assert:
        that:
          - "'reporting_url:' in axon_dash_config_text"
          - "axon_dash_reporting_url in axon_dash_config_text"
        fail_msg: >-
          Expected axon-dash.reporting_url to be templated from axon_dash_reporting_url
          even when axon_dash_reporting_enabled is false.
