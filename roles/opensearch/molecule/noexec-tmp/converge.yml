---
# Proves the opensearch_tmp_dir guards: an explicit empty string must disable
# the override entirely rather than rendering an empty path (issue #146).
- name: Converge
  hosts: all
  vars:
    opensearch_version: "3.8.0"
    opensearch_cluster_name: molecule-noexec-tmp
    opensearch_cluster_type: single-node
    opensearch_heap_size: "512m"
    opensearch_security_enabled: false
    opensearch_populate_etc_hosts: false
    opensearch_start_on_boot: false
    opensearch_start_on_install: false
    opensearch_tmp_dir: ""

  roles:
    - role: opensearch

