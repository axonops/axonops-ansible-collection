---
# ============================================================================
# OpenSearch Role - Main Tasks
# ============================================================================

- name: Warn about default cluster name
  ansible.builtin.debug:
    msg: >-
      WARNING: opensearch_cluster_name is set to 'opensearch'. For production
      deployments, set opensearch_cluster_name to a meaningful cluster name.
  when: opensearch_cluster_name is not defined or opensearch_cluster_name == 'opensearch'
  tags: always

- name: Validate host architecture is supported
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: >-
      Unsupported architecture '{{ ansible_architecture }}'. OpenSearch bundles are
      published for x86_64 and aarch64 only. Installing a bundle built for another
      architecture leaves an unrunnable JDK and the service fails at start with
      'Exec format error'. Override opensearch_arch if you know a suitable bundle exists.
  tags: always

- name: Validate admin password is set when security is enabled
  ansible.builtin.assert:
    that:
      - opensearch_admin_password is defined and opensearch_admin_password | length > 0
    fail_msg: >-
      opensearch_admin_password must be set when opensearch_security_enabled is true.
  when: opensearch_security_enabled
  tags: always

- name: Validate snapshot repository settings
  ansible.builtin.assert:
    that:
      - opensearch_snapshot_type in ['s3', 'gcs']
      - opensearch_snapshot_bucket | length > 0
      - opensearch_snapshot_client | length > 0
      - opensearch_snapshot_repository_name | length > 0
      - (opensearch_snapshot_s3_access_key | length > 0) == (opensearch_snapshot_s3_secret_key | length > 0)
      - opensearch_snapshot_s3_session_token | length == 0 or opensearch_snapshot_s3_access_key | length > 0
      - opensearch_snapshot_s3_protocol in ['', 'http', 'https']
      - opensearch_snapshot_client is match('^[A-Za-z0-9_-]+$')
      - opensearch_snapshot_repository_name is match('^[a-z0-9_.-]+$')
      - opensearch_snapshot_s3_extra_settings is mapping
      - opensearch_snapshot_s3_extra_settings.keys() | reject('match', '^[a-z0-9_]+$') | list | length == 0
      - opensearch_snapshot_s3_extra_settings.keys() | intersect(['access_key', 'secret_key', 'session_token']) | length == 0
      - opensearch_snapshot_policy is mapping
      - opensearch_snapshot_policy | length == 0 or opensearch_snapshot_policy.name | default('') is match('^[A-Za-z0-9_.-]+$')
    fail_msg: >-
      Invalid snapshot settings: opensearch_snapshot_type must be 's3' or 'gcs',
      opensearch_snapshot_bucket must not be empty, opensearch_snapshot_client
      and opensearch_snapshot_repository_name must be plain names (letters,
      digits, '_', '-', and '.' for the repository),
      opensearch_snapshot_s3_access_key and opensearch_snapshot_s3_secret_key must be
      set together (a session token needs both), opensearch_snapshot_s3_protocol must be 'http' or 'https',
      opensearch_snapshot_s3_extra_settings must be a mapping of plain setting names without credential keys,
      and opensearch_snapshot_policy needs a plain 'name' when set.
    quiet: true
  when: opensearch_snapshot_enabled
  tags: always

- name: Populate /etc/hosts
  ansible.builtin.import_tasks: etchosts.yml
  when: opensearch_populate_etc_hosts
  tags: hosts

- name: Tune system settings
  ansible.builtin.import_tasks: tune.yml
  tags: tune

- name: Install OpenSearch
  ansible.builtin.import_tasks: opensearch.yml
  tags: install

# Before security.yml: it starts OpenSearch, which fails on s3.*/gcs.* settings
# in opensearch.yml when the repository plugin is not yet installed.
- name: Install snapshot repository plugin and credentials
  ansible.builtin.import_tasks: snapshot.yml
  when: opensearch_snapshot_enabled
  # install renders s3.*/gcs.* settings into opensearch.yml, so it needs the plugin too
  tags:
    - install
    - snapshot

- name: Configure security plugin
  ansible.builtin.import_tasks: security.yml
  when: opensearch_security_enabled
  tags: security

- name: Ensure OpenSearch is started
  ansible.builtin.systemd:
    name: opensearch
    daemon_reload: true
    state: started
    enabled: "{{ opensearch_start_on_boot }}"
  when: opensearch_start_on_install
  tags: service

- name: Wait for OpenSearch to be ready
  ansible.builtin.wait_for:
    host: "{{ opensearch_network_host }}"
    port: "{{ opensearch_api_port }}"
    delay: 5
    connect_timeout: 1
    timeout: 120
  when: opensearch_start_on_install
  tags: service

- name: Check OpenSearch cluster health
  ansible.builtin.uri:
    url: "https://{{ opensearch_network_host }}:{{ opensearch_api_port }}/_cluster/health?pretty"
    user: admin
    password: "{{ opensearch_admin_password }}"
    validate_certs: false
    force_basic_auth: true
  register: _opensearch_health
  retries: 5
  delay: 5
  until: _opensearch_health.status == 200
  when: opensearch_start_on_install and opensearch_security_enabled
  tags: health

- name: Check OpenSearch cluster health (no security)
  ansible.builtin.uri:
    url: "http://{{ opensearch_network_host }}:{{ opensearch_api_port }}/_cluster/health?pretty"
    validate_certs: false
  register: _opensearch_health
  when: opensearch_start_on_install and not opensearch_security_enabled
  tags: health

- name: Show OpenSearch cluster health
  ansible.builtin.debug:
    msg: "{{ _opensearch_health.json }}"
  when: _opensearch_health is defined and _opensearch_health.json is defined
  tags: health

# include_tasks so the handler flush inside runs only when snapshots are enabled
- name: Register snapshot repository and policy
  ansible.builtin.include_tasks:
    file: snapshot_repository.yml
    apply:
      tags: snapshot
  when: opensearch_snapshot_enabled and opensearch_start_on_install
  tags: snapshot

# code: language=ansible
