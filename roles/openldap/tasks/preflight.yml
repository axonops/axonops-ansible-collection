---
- name: Validate admin password is set
  ansible.builtin.assert:
    that:
      - openldap_admin_password is defined
      - openldap_admin_password is string
      - openldap_admin_password | length > 0
    fail_msg: >-
      openldap_admin_password must be set. It has no default. Store it with
      ansible-vault or inject it from a secrets manager.
    quiet: true

- name: Validate base DN
  ansible.builtin.assert:
    that:
      - openldap_base_dn is match('^dc=[^,]+')
    fail_msg: >-
      openldap_base_dn '{{ openldap_base_dn }}' must start with a dc= component,
      for example dc=axonops,dc=local.
    quiet: true

- name: Validate supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: "Unsupported OS family '{{ ansible_facts['os_family'] }}'. Supported: RedHat, Debian."
    quiet: true

- name: Validate TLS settings
  ansible.builtin.assert:
    that:
      - openldap_tls_mode in ['disabled', 'generate', 'custom']
      - openldap_tls_mode != 'custom' or (openldap_tls_cert | length > 0 and openldap_tls_key | length > 0)
      - not openldap_listen_ldaps or openldap_tls_mode != 'disabled'
      - openldap_listen_ldap or openldap_listen_ldaps
      - openldap_tls_protocol_min | string in ['3.3', '3.4']
    fail_msg: >-
      Invalid TLS settings. openldap_tls_mode must be disabled, generate or custom.
      custom needs openldap_tls_cert and openldap_tls_key. openldap_listen_ldaps
      needs openldap_tls_mode generate or custom. At least one of
      openldap_listen_ldap and openldap_listen_ldaps must be true.
      openldap_tls_protocol_min must be 3.3 (TLS 1.2) or 3.4 (TLS 1.3).
    quiet: true

- name: Validate groups
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name | length > 0
      - item.axon_role is not defined or item.axon_role in ['superUserRole', 'adminRole', 'readOnlyRole', 'backupAdminRole']
    fail_msg: >-
      Invalid entry in openldap_groups: each group needs a name, and axon_role
      (when set) must be superUserRole, adminRole, readOnlyRole or backupAdminRole.
    quiet: true
  loop: "{{ openldap_groups }}"
  loop_control:
    label: "{{ item.name | default('<unnamed>') }}"

- name: Validate users
  # Asserts over mapped attributes only, so no password reaches the output.
  ansible.builtin.assert:
    that:
      - openldap_users | selectattr('uid', 'undefined') | list | length == 0
      - openldap_users | map(attribute='uid', default='') | select('equalto', '') | list | length == 0
      - openldap_users | map(attribute='uid') | unique | list | length == openldap_users | length
      - openldap_users | selectattr('password', 'undefined') | list | length == 0
      - openldap_users | map(attribute='password', default='') | reject('string') | list | length == 0
      - openldap_users | map(attribute='password', default='') | select('equalto', '') | list | length == 0
      - >-
        openldap_users | map(attribute='groups', default=[]) | flatten
        | difference(openldap_groups | map(attribute='name')) | length == 0
    fail_msg: >-
      Invalid openldap_users: every user needs a unique, non-empty uid and a
      non-empty string password, and every group in 'groups' must be listed in
      openldap_groups.
    quiet: true
