---
# Collections baked into the Execution Environment.
#
# axonops.axonops is installed from an explicit git tag rather than from Galaxy
# so that the image can be built for a tag before (or without) a Galaxy release.
#
# This pin records what the last released image contains. Pushing a `v*` tag
# builds the image from that tag whatever this pin says, so bump it alongside
# `galaxy.yml` in the pull request that prepares a release. Manual
# `workflow_dispatch` builds override it with the ref they are given, and
# pull-request builds use `main`.
collections:
  - name: https://github.com/axonops/axonops-ansible-collection.git
    type: git
    version: v0.7.1

# The collections the roles call. These are also declared in the repository-root
# `galaxy.yml` as dependencies of `axonops.axonops`; they are repeated here so the
# image contents do not depend on the dependency-resolution behaviour of whichever
# `ansible-galaxy` version `ansible-builder` happens to run.
  - name: ansible.posix
  - name: community.general
  - name: community.crypto
  - name: community.docker
    version: ">=3.0.0"
  - name: kubernetes.core
    version: ">=3.0.0"
