name: Release collection

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if tag is not prefixed by v
        run: |
          if [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9].* ]]; then
              echo "Valid version format"
          else
              echo "Invalid version format"
              exit 1
          fi

      - name: Bump the version on the default branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          EE_REQUIREMENTS=ci/execution-environment/requirements.yml

          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"

          sed -i -E "s/^version: .*/version: ${VERSION}/" galaxy.yml
          # Keep the Execution Environment pin in step with the release, so the
          # committed record on the default branch names the tag just released.
          sed -i -E "s/^( +version: )v[0-9].*/\1${GITHUB_REF_NAME}/" "$EE_REQUIREMENTS"

          if git diff --quiet -- galaxy.yml "$EE_REQUIREMENTS"; then
            echo "Already at ${VERSION}, nothing to bump"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add galaxy.yml "$EE_REQUIREMENTS"
          git commit -m "chore(release): bump collection version to ${VERSION}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          OPTIONS=""
          if [[ $GITHUB_REF_NAME == *"internal"* ]]; then
            OPTIONS="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
              --repo="$GITHUB_REPOSITORY" \
              --title="Release for ${GITHUB_REF_NAME}" \
              --generate-notes $OPTIONS

  build:
    name: Package Ansible Galaxy collection
    runs-on: ubuntu-latest
    needs: [release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set galaxy.yml version from tag
        run: |
          sed -i -E "s/^version: .*/version: ${GITHUB_REF_NAME#v}/" galaxy.yml
      - name: Install ansible
        run: sudo apt update && sudo apt-get -y install ansible
      - name: Package
        run: ansible-galaxy collection build
      - name: Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to Ansible Galaxy
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set galaxy.yml version from tag
        run: |
          sed -i -E "s/^version: .*/version: ${GITHUB_REF_NAME#v}/" galaxy.yml
      - name: Install ansible
        run: sudo apt update && sudo apt-get -y install ansible
      - name: Build and publish collection
        run: |
          ansible-galaxy collection build
          ansible-galaxy collection publish *.tar.gz --token ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
