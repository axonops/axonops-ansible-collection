- name: Deploy AxonOps Server
  hosts: axon-server
  become: true
  vars:
    install_cassandra: true
    # Search backend: set install_opensearch or install_elastic to true (not both)
    install_opensearch: true
    install_elastic: false
    # Local OpenLDAP directory for axon-server LDAP login and role mapping
    install_openldap: true
    axon_server_cql_hosts:
      - localhost:9042
    axon_dash_listen_address: 0.0.0.0
    opensearch_network_host: 127.0.0.1
    cassandra_cluster_name: axonops
    cassandra_dc: default
    cassandra_rack: rack1
    axon_java_agent: "axon-cassandra5.0-agent-jdk17"
    axon_agent_server_host: localhost
    axon_agent_tls_mode: "disabled"
    axon_agent_customer_name: "mycompany"
    # Required by the server role. Must match axon_agent_customer_name.
    axon_server_org_name: "mycompany"
    # Start Cassandra on first install (single-node demo)
    cassandra_start_on_install: true
    cassandra_start_on_boot: true
    cassandra_listen_address: "localhost"
    cassandra_rpc_address: "localhost"

    # --- OpenSearch configuration (used when install_opensearch: true) ---
    # OpenSearch is the preferred search backend for on-premises AxonOps deployments.
    # Store the admin password in Ansible Vault in production.
    opensearch_cluster_name: axonops
    opensearch_cluster_type: single-node
    opensearch_admin_password: "changeme"
    opensearch_domain_name: example.com

    # AxonOps Server connection to OpenSearch
    axon_server_searchdb_hosts:
      - "https://127.0.0.1:9200"
    axon_server_searchdb_username: admin
    axon_server_searchdb_password: "changeme"
    axon_server_searchdb_tls_skip_verify: true

    # --- Elasticsearch configuration (used when install_elastic: true) ---
    # Uncomment and adjust these if using Elasticsearch instead of OpenSearch.
    # axon_server_searchdb_hosts:
    #   - "http://127.0.0.1:9200"

    # --- OpenLDAP configuration (used when install_openldap: true) ---
    # One sample user per AxonOps role. Store all passwords in Ansible Vault
    # in production. axon-server only enables LDAP with a license key.
    # axon_server_license_key: "your-license-key"
    openldap_admin_password: "changeme"
    # axon-server runs on this host, so it reaches slapd over loopback.
    # Enable TLS (openldap_tls_mode: generate) if the directory is remote.
    openldap_axon_server_host: localhost
    openldap_users:
      - uid: superuser
        cn: Super User
        sn: User
        mail: superuser@example.com
        password: "changeme-super"
        groups: [axonops_super]       # superUserRole
      - uid: admin
        cn: Admin User
        sn: User
        mail: admin@example.com
        password: "changeme-admin"
        groups: [axonops_admin]       # adminRole
      - uid: readonly
        cn: Read Only
        sn: User
        mail: readonly@example.com
        password: "changeme-readonly"
        groups: [axonops_readonly]    # readOnlyRole
      - uid: backup
        cn: Backup Admin
        sn: User
        mail: backup@example.com
        password: "changeme-backup"
        groups: [axonops_backup]      # backupAdminRole

    # AxonOps Server LDAP authentication, using the setting published by the
    # openldap role. The published setting has no bindPassword, so add it here.
    axon_server_ldap_enabled: "{{ install_openldap | default(false) | bool }}"
    axon_server_ldap_setting: >-
      {{ openldap_axon_server_ldap_setting | default({})
         | combine({'bindPassword': openldap_admin_password}) }}


  pre_tasks:
    # This is only for this example to work, please review your firewall settings and requirements
    - name: "Stop firewalld"
      ansible.builtin.systemd:
        name: firewalld
        enabled: false
        state: stopped
      when: ansible_os_family == 'RedHat'
      failed_when: false

  roles:
    - name: java
      role: axonops.axonops.java
      tags: java
    - role: axonops.axonops.agent
      tags: agent, axonops-agent
    - role: axonops.axonops.cassandra
      tags: cassandra
      when: install_cassandra is defined and install_cassandra
    - role: axonops.axonops.opensearch
      tags: opensearch
      when: install_opensearch is defined and install_opensearch
    - role: axonops.axonops.elastic
      tags: elastic
      when: install_elastic is defined and install_elastic
    - role: axonops.axonops.openldap
      tags: openldap
      when: install_openldap is defined and install_openldap
    - role: axonops.axonops.server
      tags: server, axonops-server
    - role: axonops.axonops.dash
      tags: dash, axonops-dashboard

# code: language=ansible
