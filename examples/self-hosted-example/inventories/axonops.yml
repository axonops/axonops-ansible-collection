all:
  children:
    axonops_server:
      hosts:
        157.90.235.43:
      vars:
        # Organisation name. REQUIRED by the server role — the play fails without it.
        # Keep this in sync with axon_agent_customer_name on the Cassandra nodes.
        axon_server_org_name: mycompany

        # Search backend connection, consumed by the server role.
        # axon_server_searchdb_hosts accepts a list of URLs (server >= 2.0.4 syntax)
        axon_server_searchdb_hosts: "{{ groups['axonops_searchdb'] | map('regex_replace', '^(.*)$', 'http://\\1:9200') | list }}"
        # This example runs Elasticsearch without authentication. If X-Pack security
        # is enabled on your cluster, set both of these (use Ansible Vault):
        # axon_server_searchdb_username: elastic
        # axon_server_searchdb_password: "changeme"

        # Cassandra metrics store. Without it the server has nowhere to write metrics.
        # PLACEHOLDER — replace these with every node in the axonops_cassandra group
        # of inventories/cassandra.yml. This cannot be derived from groups[...] because
        # the Cassandra hosts live in a separate inventory file.
        axon_server_cql_hosts:
          - "157.90.235.43:9042"
          - "188.245.42.4:9042"
          - "168.119.234.32:9042"
        axon_server_username: cassandra
        axon_server_password: cassandra
        axon_server_local_dc: default

        # Dashboard. The role defaults to 127.0.0.1, which is unreachable from
        # outside the host — bind it to a routable address instead.
        axon_dash_listen_address: 0.0.0.0
        axon_dash_listen_port: 3000

    axonops_searchdb:
      hosts:
        157.90.235.43:
        188.245.42.4:
        168.119.234.32:
      vars:
        es_heap_size: "1g"
        # All three nodes are master-eligible and hold data, so the cluster keeps a
        # quorum (2 of 3) if one node is lost. Seed and bootstrap lists are derived
        # from the group so they cannot drift out of sync with the host list.
        es_config:
          cluster.name: "test-axonops-cluster"
          node.name: "{{ inventory_hostname }}"
          discovery.seed_hosts: "{{ groups['axonops_searchdb'] | map('regex_replace', '^(.*)$', '\\1:9300') | list }}"
          # Only used the first time the cluster starts; safe to remove afterwards.
          cluster.initial_master_nodes: "{{ groups['axonops_searchdb'] }}"
          http.host: "{{ ansible_default_ipv4.address }}"
          http.port: 9200
          transport.host: "{{ ansible_default_ipv4.address }}"
          transport.port: 9300
          node.master: true
          node.data: true
          bootstrap.memory_lock: false
