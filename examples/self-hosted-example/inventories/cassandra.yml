all:
  children:
    # The AxonOps Server the agents report to. Deploy it first with
    # axon-server.yml and one of the axonops*.yml inventories.
    axonops_server:
      hosts:
        157.90.235.43:

    axonops_cassandra:
      hosts:
        157.90.235.43:
        188.245.42.4:
        168.119.234.32:
      vars:
        axon_java_agent: "axon-cassandra5.0-agent-jdk17"
        axon_agent_version: "2.0.7"
        axon_java_agent_version: "1.0.10"
        cassandra_cluster_name: mycluster000
        cassandra_dc: default
        cassandra_rack: rack1
        cassandra_start_on_boot: true
        # This is the AxonOps Server host, it can be localhost or the IP of the AxonOps Server
        # Leave empty if you want to use the SaaS environment
        axon_agent_server_host: "{{ groups['axonops_server'] | first }}"
        axon_agent_tls_mode: "disabled"
        # Must match axon_server_org_name on the AxonOps Server
        axon_agent_customer_name: "mycompany"
        # This example auto-discovers the IP address, in production you might want to set this to a static IP
        cassandra_listen_address: "{{ ansible_default_ipv4.address }}"
        cassandra_rpc_address: "{{ ansible_default_ipv4.address }}"
        cassandra_seeds: "{{ groups['axonops_cassandra'] | map('extract', hostvars, ['ansible_default_ipv4', 'address']) | list | join(',') }}"
