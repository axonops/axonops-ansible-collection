all:
  children:
    axonops_server:
      hosts:
        157.90.235.43:
      vars:
        # Organisation name. REQUIRED by the server role — the play fails without it.
        # Keep this in sync with axon_agent_customer_name on the Cassandra nodes.
        axon_server_org_name: mycompany

        # Search backend connection, consumed by the server role.
        # Use https:// and set axon_server_searchdb_tls_skip_verify: true when using
        # the auto-generated self-signed certificates from opensearch_tls_mode: generate
        axon_server_searchdb_hosts: "{{ groups['axonops_searchdb'] | map('regex_replace', '^(.*)$', 'https://\\1:9200') | list }}"
        axon_server_searchdb_username: admin
        # Must match opensearch_admin_password below.
        # Store this in Ansible Vault in production.
        axon_server_searchdb_password: "changeme"
        axon_server_searchdb_tls_skip_verify: true

        # Cassandra metrics store. Point this at your Cassandra nodes — without it
        # the server has nowhere to write metrics.
        axon_server_cql_hosts:
          - "157.90.235.43:9042"
        axon_server_username: cassandra
        axon_server_password: cassandra
        axon_server_local_dc: default

        # Dashboard. The role defaults to 127.0.0.1, which is unreachable from
        # outside the host — bind it to a routable address instead.
        axon_dash_listen_address: 0.0.0.0
        axon_dash_listen_port: 3000

    axonops_searchdb:
      hosts:
        157.90.235.43:
        188.245.42.4:
        168.119.234.32:
      vars:
        # OpenSearch cluster configuration
        opensearch_cluster_name: axonops
        opensearch_cluster_type: multi-node
        opensearch_heap_size: "2g"
        opensearch_domain_name: example.com
        # Store the admin password in Ansible Vault in production
        opensearch_admin_password: "changeme"
