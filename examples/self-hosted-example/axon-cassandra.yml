- name: Installs the Apache Cassandra database where AxonOps stores metrics
  hosts: axonops_cassandra
  become: true
  # All Cassandra and agent variables live in inventories/cassandra.yml so that
  # they are not silently overridden by play vars.

  pre_tasks:
    # This is only for this example to work, please review your firewall settings and requirements
    - name: "Stop firewalld"
      ansible.builtin.systemd:
        name: firewalld
        enabled: false
        state: stopped
      when: ansible_os_family == 'RedHat'
      failed_when: false

  roles:
    - role: axonops.axonops.java
      tags: java
    - role: axonops.axonops.agent
      tags: agent
    - role: axonops.axonops.cassandra
      tags: cassandra

